# ==============================================================================
# Pipeline V2: Node Schemas Configuration
# Version: 2.0.0
# Description: Declarative node schemas for all canonical and reified entities
#              frozen in Phase 0.2. Strict typing, nullability, and primary keys.
# ==============================================================================

version: "2.0.0"

nodes:
  - node_type: "Ingredient"
    output_filename: "Nodes/Ingredients.csv"
    primary_key: "ingredient_id"
    required_fields:
      - "ingredient_id"
      - "canonical_name"
      - "entity_type"
      - "validation_status"
      - "created_at"
    optional_fields:
      - "synonyms"
      - "foodon_id"
      - "botanical_name"
      - "description"
    field_types:
      ingredient_id: "string"
      canonical_name: "string"
      entity_type: "string"
      validation_status: "string"
      created_at: "iso_datetime"
      synonyms: "string"
      foodon_id: "string"
      botanical_name: "string"
      description: "string"
    uniqueness_constraints:
      - "ingredient_id"
      - "canonical_name"
    nullability:
      ingredient_id: false
      canonical_name: false
      entity_type: false
      validation_status: false
      created_at: false
      synonyms: true
      foodon_id: true
      botanical_name: true
      description: true
    provenance_requirements:
      - "source_dataset_id"
      - "source_record_id"

