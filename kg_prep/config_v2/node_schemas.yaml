      - "supplier_id"
    field_types:
      ingredient_grade_id: "string"
      ingredient_id: "string"
      grade_name: "string"
      quality_standard: "string"
      purity_percentage: "float"
      material_state: "string"
      supplier_id: "string"
    uniqueness_constraints:
