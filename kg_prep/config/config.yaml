general:
  data_dir: "data"
  metadata_file: "data/metadata.json"
  log_file: "data/download_log.csv"
  log_level: "INFO"

http:
  timeout: 30
  max_retries: 3
  backoff_factor: 2.0
  rate_limit_delay: 1.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) FoodKG-Acquisition/1.0"

sources:
  - id: "foodb"
    name: "FooDB"
    domain: "structured"
    path: "structured/foodb"
    official_source: "https://foodb.ca/"
    download_url: "https://foodb.ca/system/downloads/foodb_2020_04_07_csv.zip"
    access_mode: "Automatic"
    license: "Non-commercial Research"
    file_type: "zip"
    status: "active"

  - id: "usda_fdc"
    name: "USDA FoodData Central"
    domain: "structured"
    path: "structured/usda_fdc"
    official_source: "https://fdc.nal.usda.gov/"
    download_url: "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_csv_2024-04-18.zip"
    access_mode: "Automatic"
    license: "Public Domain"
    file_type: "zip"
    status: "active"

  - id: "recipe1m"
    name: "Recipe1M+"
    domain: "structured"
    path: "structured/recipe1m"
    official_source: "http://im2recipe.csail.mit.edu/"
    download_url: ""
    access_mode: "Manual"
    license: "Academic Use"
